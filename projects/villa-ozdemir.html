<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>VILLA OZDEMIR — DOGAN ARCHITECTURE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:90px;
    padding:0 45px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:1000;
    mix-blend-mode:difference;
}

.logo{
    width:48px;
    height:48px;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:brightness(0) invert(1);
}

.back{
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.hero{
    height:100svh;
    min-height:600px;
    position:relative;
    overflow:hidden;
}

.hero>img{
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.08);
    animation:zoom 1.6s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes zoom{
    to{transform:scale(1);}
}

.hero:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.75),transparent 65%);
}

.hero-info{
    position:absolute;
    z-index:2;
    bottom:45px;
    left:45px;
    right:45px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
}

.title{
    font-size:clamp(55px,9vw,140px);
    line-height:.82;
    letter-spacing:-5px;
    font-weight:500;
}

.number{
    font-size:10px;
    letter-spacing:2px;
    margin-bottom:15px;
}

.details{
    text-align:right;
    font-size:10px;
    line-height:1.8;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.intro{
    min-height:65vh;
    padding:150px 45px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:100px;
}

.intro-title{
    font-size:10px;
    letter-spacing:2px;
}

.description{
    max-width:650px;
    font-size:23px;
    line-height:1.4;
    font-weight:300;
}

.gallery{
    width:100%;
    overflow:hidden;
}

.gallery-item{
    width:100%;
    margin-bottom:3px;
    opacity:0;
    transform:translateX(-120px) scale(.985);
    transition:
        opacity .65s cubic-bezier(.16,1,.3,1),
        transform .85s cubic-bezier(.16,1,.3,1);
}

.gallery-item:nth-child(even){
    transform:translateX(120px) scale(.985);
}

.gallery-item.visible{
    opacity:1;
    transform:translateX(0) scale(1);
}

.gallery-item img{
    width:100%;
    height:auto;
    display:block;
}

.next{
    min-height:50vh;
    padding:100px 45px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-top:1px solid #333;
}

.next-label{
    font-size:10px;
    letter-spacing:2px;
}

.next-title{
    font-size:clamp(45px,7vw,110px);
    letter-spacing:-4px;
}

@media(max-width:700px){

    header{
        height:70px;
        padding:0 20px;
    }

    .logo{
        width:38px;
        height:38px;
    }

    .hero-info{
        left:20px;
        right:20px;
        bottom:35px;
        display:block;
    }

    .title{
        font-size:15vw;
        margin-bottom:25px;
    }

    .details{
        text-align:left;
    }

    .intro{
        display:block;
        padding:90px 20px;
    }

    .intro-title{
        margin-bottom:50px;
    }

    .description{
        font-size:18px;
    }

    .next{
        padding:70px 20px;
        display:block;
    }

    .next-title{
        margin-top:30px;
    }
}

</style>
</head>

<body>

<header>

<a href="../index.html" class="logo">
<img src="../images/logo.png" alt="DOGAN ARCHITECTURE">
</a>

<a href="../index.html" class="back">
← PROJETS
</a>

</header>


<section class="hero">

<img src="../images/villa-ozdemir/cover.jpg" alt="Villa Ozdemir">

<div class="hero-info">

<div>

<div class="number">07 / 07</div>

<h1 class="title">
VILLA<br>OZDEMIR
</h1>

</div>

<div class="details">
ESBLY<br>
2023<br>
VILLA<br>
7329 m²
</div>

</div>

</section>


<section class="intro">

<div class="intro-title">
PROJECT
</div>

<div class="description">

Villa Ozdemir est un projet résidentiel
situé à Esbly.

<br><br>

Le projet propose une architecture
contemporaine pensée autour des espaces
de vie et du paysage environnant.

</div>

</section>


<section
    class="gallery"
    data-folder="../images/villa-ozdemir/">
</section>


<a href="bureau-zafer.html" class="next">

<div class="next-label">
BACK TO FIRST PROJECT
</div>

<div class="next-title">
BUREAU ZAFER →
</div>

</a>


<script>

const gallery=document.querySelector(".gallery");
const folder=gallery.dataset.folder;

const observer=new IntersectionObserver(
    entries=>{
        entries.forEach(entry=>{
            if(entry.isIntersecting){
                entry.target.classList.add("visible");
            }
        });
    },
    {
        threshold:.08,
        rootMargin:"0px 0px -8% 0px"
    }
);

for(let i=1;i<=30;i++){

    const number=String(i).padStart(2,"0");

    const item=document.createElement("div");
    item.className="gallery-item";

    const img=document.createElement("img");

    img.src=folder+number+".jpg";
    img.alt="Villa Ozdemir "+number;

    img.onload=()=>{

        gallery.appendChild(item);
        item.appendChild(img);

        observer.observe(item);

    };

    img.onerror=()=>{
        item.remove();
    };
}

</script>

</body>
</html>
